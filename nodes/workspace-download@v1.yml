yaml-version: 3.0

id: core/workspace-download
name: Workspace Download
version: 1
category: network
icon: featherDownloadCloud
short_desc: Download files from the repo workspace on the orchestrator and write them to disk.
style:
  header:
    background: "#1b5f5e"
  body:
    background: "#429694"
outputs:
  exec-success:
    name: Success
    exec: true
    index: 0
  exec-err:
    name: Error
    exec: true
    index: 1
inputs:
  exec:
    exec: true
    index: 0
  paths:
    name: Paths
    type: "[]string"
    index: 1
    default:
      - "*"
    desc: File paths within the workspace to download. Each file is written to the same relative path on disk. Use "*" to download the entire workspace.
