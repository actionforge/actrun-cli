yaml-version: 3.0
id: core/string-encode
name: String Encode
category: processing
icon: tablerHash
version: 1
style:
  header:
    background: "#6e6e6e"
  body:
    background: "#423f3f"
short_desc: Encode a UTF-8 string into various string-based formats like Base64, Hex, UTF-16, UTF-32, or apply escape sequences for HTML, URL, JSON, and XML.
addendum: |
  ## Encoding Operations

  This node takes a standard UTF-8 string and encodes it.

  - **Printable Formats (Base64, Hex, etc.):**
    These operations produce a human-readable ASCII string.

  - **Raw Byte Formats (UTF-16, UTF-32):**
    These operations produce a string object containing the raw encoded bytes.
    **This output will not be human-readable** and is intended to be used
    with the `String Decode` node.

  - **Escape Formats (HTML, URL, JSON, XML):**
    These operations escape special characters in the input string to make
    them safe for use in the respective context.
outputs:
  result:
    type: string
    index: 0
    desc: The resulting encoded string.
inputs:
  input:
    name: Input
    type: string
    index: 0
    desc: The UTF-8 string to encode.
  op:
    name: Encoding
    type: option
    index: 1
    default: base64
    desc: The encoding operation to apply.
    options:
      - name: To Base16 (Hex)
        value: hex
      - name: To Base32
        value: base32
      - name: To Base64
        value: base64
      - name: To Base64 (URL Safe)
        value: base64url
      - name: To UTF-16 LE
        value: utf16le
      - name: To UTF-16 BE
        value: utf16be
      - name: To UTF-32 LE
        value: utf32le
      - name: To UTF-32 BE
        value: utf32be
      - name: To HTML Escape
        value: html
      - name: To URL Encode (Query)
        value: url
      - name: To URL Encode (Path)
        value: urlpath
      - name: To JSON Escape
        value: json
      - name: To XML Escape
        value: xml