yaml-version: 3.0

id: core/secret-set
version: 1
name: Set Secret
icon: octKey
category: system
short_desc: A node to set a secret value at runtime.
long_desc: Sets a secret value that can be retrieved later using the Get Secret node.
style:
  header:
    background: "#3794ff"
  body:
    background: "#1f4f86"
inputs:
  exec:
    exec: true
    index: 0
    name: ''
    desc: Triggers the setting of the secret.
  name:
    name: Name
    type: string
    hint: "e.g. MY_KEY"
    required: true
    desc: The name of the secret to set.
    index: 1
  value:
    name: Value
    type: string
    hint: "e.g. secret-value"
    required: true
    desc: The value of the secret.
    index: 2

outputs:
  exec-success:
    name: ''
    exec: true
    index: 0
    desc: Triggered when the secret is successfully set.
